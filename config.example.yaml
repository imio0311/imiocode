provider: deepseek
model: deepseek-chat
connect-timeout-seconds: 10
request-timeout-seconds: 120
max-output-tokens: 4096

thinking:
  enabled: false
  mode: auto
  budget-tokens: 1024
  effort: high
  summary: auto

agent:
  max-iterations: 20
  timeout-seconds: 600
  max-parallel-tools: 4

providers:
  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: https://api.openai.com
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    base-url: https://api.anthropic.com
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com

context:
  window-tokens: 64000
  auto-compact-threshold: 0.80

ui:
  # compact：默认精简输出；verbose：显示状态、Thinking、Usage 和完整工具生命周期
  verbosity: compact

instructions:
  enabled: true
  max-include-depth: 8
  max-expanded-bytes: 131072

sessions:
  enabled: true
  retention-days: 0       # 0 表示不按天自动删除
  max-sessions: 0         # 0 表示不按数量自动删除

memory:
  enabled: true
  # 开启后会把脱敏后的本轮用户/助手文本再次发给当前 LLM Provider；默认关闭
  auto-extract: false
  user-scope-enabled: true
  project-scope-enabled: true
  max-entries-per-scope: 200
  max-entry-chars: 1000
  max-file-bytes: 262144
  extraction-output-tokens: 1024

skills:
  install:
    timeout-seconds: 30
    max-files: 64
    max-file-bytes: 262144
    max-total-bytes: 2097152
    allowed-hosts:
      - skills.sh
      - github.com
      - raw.githubusercontent.com
      - api.github.com

mcp:
  servers:
    context7:
      enabled: true
      transport: stdio
      command: npx
      args:
        - -y
        - '@upstash/context7-mcp'
      initialization-timeout-seconds: 120
      call-timeout-seconds: 120

permissions:
  mode: ask
  rules:
    - action: allow
      tool: mcp_context7__query-docs
    - action: allow
      tool: mcp_context7__resolve-library-id
