provider: deepseek
model: deepseek-chat
connect-timeout-seconds: 10
request-timeout-seconds: 120
max-output-tokens: 4096

thinking:
  enabled: false
  mode: auto
  budget-tokens: 1024
  effort: high
  summary: auto

agent:
  max-iterations: 20
  timeout-seconds: 600
  max-parallel-tools: 4

# CH14 Git Worktree。所有目录都限制在当前仓库的 .imiocode 受管空间。
worktrees:
  directory: .imiocode/worktrees
  git-timeout-seconds: 10
  stale-after-hours: 168
  cleanup-interval-seconds: 3600
  copy-local-config: true
  link-directories: [node_modules, .venv, venv, vendor]
  copy-includes: []

# CH13 子 Agent。haiku 是逻辑别名；未配置时会回退当前父模型并显示警告。
subagents:
  model-aliases:
    # haiku: claude-3-5-haiku-latest
  globally-denied-tools: [agent, install_skill]
  background-allowed-tools: [read_file, glob, grep]
  max-background-tasks: 4
  max-task-records: 128
  notification-capacity: 128

providers:
  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: https://api.openai.com
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    base-url: https://api.anthropic.com
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com

context:
  window-tokens: 64000
  auto-compact-threshold: 0.80

ui:
  # compact：默认精简输出；verbose：显示状态、Thinking、Usage 和完整工具生命周期
  verbosity: compact

instructions:
  enabled: true
  max-include-depth: 8
  max-expanded-bytes: 131072

sessions:
  enabled: true
  retention-days: 0       # 0 表示不按天自动删除
  max-sessions: 0         # 0 表示不按数量自动删除

memory:
  enabled: true
  # 开启后会把脱敏后的本轮用户/助手文本再次发给当前 LLM Provider；默认关闭
  auto-extract: false
  user-scope-enabled: true
  project-scope-enabled: true
  max-entries-per-scope: 200
  max-entry-chars: 1000
  max-file-bytes: 262144
  extraction-output-tokens: 1024

skills:
  install:
    timeout-seconds: 30
    max-files: 64
    max-file-bytes: 262144
    max-total-bytes: 2097152
    allowed-hosts:
      - skills.sh
      - github.com
      - raw.githubusercontent.com
      - api.github.com

# CH15 Agent Team。auto：tmux 会话优先 tmux；macOS+iTerm2 次之；否则 in-process。
teams:
  backend: auto
  # Coordinator Mode 仍需同时设置 IMIO_COORDINATOR_MODE=true；默认双锁均关闭。
  coordinator-enabled: false
  max-teams: 8
  max-members-per-team: 8
  max-tasks-per-team: 256
  max-messages-per-mailbox: 2048
  max-message-chars: 32000
  max-transcript-bytes: 8388608
  probe-timeout-seconds: 2
  shutdown-timeout-seconds: 10

mcp:
  servers:
    context7:
      enabled: true
      transport: stdio
      command: npx
      args:
        - -y
        - '@upstash/context7-mcp'
      initialization-timeout-seconds: 120
      call-timeout-seconds: 120

permissions:
  mode: auto-edit
  rules:
    - action: allow
      tool: mcp_context7__query-docs
    - action: allow
      tool: mcp_context7__resolve-library-id

