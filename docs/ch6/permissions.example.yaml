# 将本文件内容复制到以下任意位置之一：
# 1. 用户级：%USERPROFILE%/.imiocode/permissions.yaml
# 2. 项目级：<项目>/.imiocode/permissions.yaml
# 3. 本地级：<项目>/.imiocode/permissions.local.yaml
#
# 优先级：用户级 > 项目级 > 本地级。
# 同一个文件中第一条匹配的规则生效。
#
# 可选模式：
# lockdown / read-only / ask / auto-edit / full-access
mode: ask

rules:
  # 允许读取 src 下的文件。
  - action: allow
    tool: "read_*"
    target: "src/**"

  # Maven 测试仍需人工确认。
  - action: ask
    tool: "bash"
    target: "mvn test*"

  # 禁止修改 CI 配置。
  - action: deny
    tool: "write_file"
    target: ".github/**"

  - action: deny
    tool: "edit_file"
    target: ".github/**"

# HITL 中选择“本次会话允许相同操作”只保存在内存里，
# 不会修改此文件，也不会在下次启动时继续生效。
